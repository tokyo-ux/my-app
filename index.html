<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <style>
:root{
  --bg1:#111;
  --bg2:#2b2b2b;
  --accent:#FFD27F;
  --text:#E6E1C5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: "Courier New", Courier, monospace;
  background:
    radial-gradient(circle at 10% 10%, rgba(255,255,255,0.03), transparent 20%),
    linear-gradient(180deg,#0b1020 0%,#1b2330 100%);
  color:var(--text);
  display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;
}
h1{
  color:var(--accent);
  font-size:24px;
  text-shadow: 0 0 2px rgba(255,210,127,0.6);
  margin-bottom:16px;
  letter-spacing:2px;
}
#gameContainer{position:relative;margin-bottom:20px}
canvas{
  border:6px solid #111;
  background:linear-gradient(180deg,#041018 0%, #00121a 100%);
  display:block;
  width:400px;height:600px;
  image-rendering: pixelated;
  box-shadow: 0 6px 0 rgba(0,0,0,0.6), inset 0 0 0 4px rgba(255,255,255,0.02);
  outline: 6px solid #0f1720;
}
#gameInfo{display:flex;gap:40px;justify-content:center;margin-bottom:10px;color:var(--text);font-size:14px}
#gameOver{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:linear-gradient(180deg, rgba(3,3,3,0.9), rgba(15,15,15,0.9));
  color:var(--text);padding:24px;border:4px solid var(--accent);text-align:center;z-index:100;display:none;
  width:320px;box-shadow:0 8px 0 rgba(0,0,0,0.6);
}
#gameOver h2{font-size:20px;margin-bottom:8px;color:var(--accent);letter-spacing:1px}
#gameOver p{font-size:16px;margin-bottom:12px}
#gameOver button{
  font-family:inherit;font-size:12px;padding:8px 20px;background:var(--accent);color:#111;border:none;cursor:pointer;
  box-shadow: 0 4px 0 #000, inset 0 -3px 0 rgba(0,0,0,0.15);border-top:2px solid rgba(255,255,255,0.2);
}
#gameOver button:hover{filter:brightness(1.05)}
.instructions{color:var(--text);text-align:center;font-size:12px;margin-top:10px;opacity:0.9}
    </style>
</head>
<body>
    <h1 style="color: white; margin-bottom: 20px;">ブロック崩しゲーム</h1>
    
    <div id="gameInfo">
        <div>スコア: <span id="score">0</span></div>
        <div>ブロック: <span id="blocksLeft">0</span></div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="gameOver">
            <h2 id="gameOverTitle">Game Over</h2>
            <p id="gameOverScore"></p>
            <button onclick="location.reload()">もう一度プレイ</button>
        </div>
    </div>

    <div class="instructions">
        <p>マウスを動かしてパドルを操作 | スペースキーでゲーム開始</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
