<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #gameContainer {
            position: relative;
            margin-bottom: 20px;
        }

        canvas {
            border: 3px solid white;
            background-color: #000;
            display: block;
            cursor: none;
        }

        #gameInfo {
            color: white;
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            gap: 40px;
            justify-content: center;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            display: none;
        }

        #gameOver h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #gameOver button {
            font-size: 18px;
            padding: 10px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        #gameOver button:hover {
            background: #764ba2;
        }

        .instructions {
            color: white;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1 style="color: white; margin-bottom: 20px;">ブロック崩しゲーム</h1>
    
    <div id="gameInfo">
        <div>スコア: <span id="score">0</span></div>
        <div>ブロック: <span id="blocksLeft">0</span></div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="gameOver">
            <h2 id="gameOverTitle">Game Over</h2>
            <p id="gameOverScore"></p>
            <button onclick="location.reload()">もう一度プレイ</button>
        </div>
    </div>

    <div class="instructions">
        <p>マウスを動かしてパドルを操作 | スペースキーでゲーム開始</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
